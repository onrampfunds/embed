name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, test, guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build first: the React wrapper typechecks against the core's emitted
      # declarations, so on a clean checkout there is nothing to resolve until
      # the core has been built.
      #
      # Then typecheck, unit tests, and every promise the README makes: lockstep
      # versions, zero runtime dependencies, the 40KB budget, no network or
      # storage API in the bundle, and the licence in both tarballs.
      - run: npm run verify

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # The suite runs in three seconds and the whole job in under a minute. Anything approaching
    # ten minutes is wedged, and should say so rather than sit there.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The browser suite runs in about three seconds. Downloading Chromium to run it took
      # between 50 and 450, which is the entire cost of this job.
      #
      # Keyed on the Playwright version rather than the lockfile hash: the browser build is tied
      # to Playwright itself, so any other dependency changing should not evict a 130MB download,
      # and upgrading Playwright must.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Playwright ${version}"

      # The browser set is part of the key: a version-only key served a
      # chromium-only cache after the matrix grew, silently skipping the
      # install step for engines the cache had never seen.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-firefox-webkit

      # Deliberately not `--with-deps`. That flag shells out to apt, which took 21 seconds on one
      # run and hung past nine minutes on another with no output — an intermittent lock or prompt,
      # and the reason this job looked stuck rather than slow.
      #
      # GitHub's ubuntu runner image already ships the shared libraries these browsers link
      # against, so apt buys nothing here. If a library ever is genuinely missing for any of the
      # three engines, Playwright fails at launch naming it, which is a visible and actionable
      # failure — unlike a silent hang that burns the six-hour default timeout.
      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit

      # The one library the runner image lacks for WebKit's GTK4 port —
      # Playwright named it at launch, exactly as the note above promises.
      # A single pinned package keeps apt's involvement small and fast where
      # `--with-deps` has hung for minutes; unconditional because system
      # libraries live outside the ms-playwright cache. The timeout turns
      # any future apt hang into a fast, visible failure.
      - name: Install WebKit's missing system library
        timeout-minutes: 5
        run: sudo apt-get install -y --no-install-recommends libgtk-4-1

      # Style isolation across the shadow boundary, container queries, keyboard
      # operability, and a request count of zero during a mount. None of these can
      # be asserted honestly in jsdom.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/embed/playwright-report/
          retention-days: 7
