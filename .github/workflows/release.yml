name: Release

# Driven by Changesets, not by hand-pushed tags.
#
# A PR that changes behaviour carries a changeset describing its bump. When it lands here, this
# workflow finds the pending changesets and opens a "Version Packages" PR that performs the whole
# bump — both manifests, the wrapper's exact pin on the core, the two exported version literals,
# and the private root. Merging *that* PR runs this workflow again, finds nothing pending, and
# publishes.
#
# The version can therefore never disagree with the thing being released, which is how a v0.0.5
# tag once arrived at a main still on 0.0.4.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # contents/pull-requests are for the version PR the bot opens; id-token is for npm.
  contents: write
  pull-requests: write
  # Trusted publishing: the workflow proves its own identity to npm over OIDC, so there is no
  # long-lived automation token in repository secrets to leak or rotate.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Kept separate from the gated job so an ordinary push to main — the overwhelming majority —
  # costs nothing and prompts nobody. Only a push that actually has a release waiting reaches the
  # environment gate.
  pending:
    name: Any changesets waiting?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-changesets: ${{ steps.check.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          set -euo pipefail
          # Every .md in .changeset is a pending bump except the README the CLI ships.
          count="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')"
          echo "has-changesets=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$count changeset(s) pending"

  release:
    name: Version and publish
    needs: pending
    if: needs.pending.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5
        with:
          # Changesets needs history to work out what has already been released.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 still ships npm 10. Pinned rather
      # than `@latest` so a release is reproducible and a new npm major cannot break publishing on
      # a day nobody touched this repo.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@11.5.1
          npm --version

      - run: npm ci

      # The bump is committed straight to main rather than raised as a PR.
      #
      # Opening a PR needs "Allow GitHub Actions to create and approve pull requests", which org
      # policy disables. The alternatives are worse: a PAT or a GitHub App private key would
      # reintroduce exactly the long-lived credential this pipeline avoids everywhere else, purely
      # to open a mechanical PR.
      #
      # Little is lost. The bump is mechanical and check:versions guards it, the changelog is
      # generated from changesets already reviewed in their own PRs, and the environment approval
      # on this job still puts a human in front of anything reaching the registry.
      #
      # The resulting push re-triggers this workflow, finds no pending changesets, and stops at
      # the `pending` job — so there is no loop and no spurious approval prompt.
      - name: Version
        run: |
          set -euo pipefail
          npm run version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version packages"
          # Rebase in case main moved while this ran. Releases are infrequent enough that a
          # conflict here means something needs a human anyway.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Publish only. `npm run verify` runs inside `release`, so nothing reaches the registry
          # without the full suite and every guard passing.
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only after something actually reached npm. A version PR merging without a publish must not
      # touch R2 — and a version path there is immutable, so a spurious upload cannot be undone.
      #
      # Runs after npm for the same reason it always did: a failed publish should never leave an
      # undeletable bundle on the CDN for a version that does not exist on the registry.
      - name: Upload the CDN bundle to R2
        if: steps.changesets.outputs.published == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./packages/embed/package.json').version")"
          major="${version%%.*}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          bucket="onramp-embed"
          dist="packages/embed/dist"
          release="embed/releases/${version}"
          alias="embed/v${major}"

          # Both files or neither. A version path is covered by the bucket lock, so a partial
          # upload cannot be repaired — it can only be abandoned and a new version cut.
          for file in onramp-embed.umd.js onramp-embed.umd.js.map; do
            if [ ! -s "${dist}/${file}" ]; then
              echo "::error::${dist}/${file} is missing or empty; refusing to upload a partial release"
              exit 1
            fi
          done

          # Fail before writing anything rather than letting the bucket lock reject it mid-upload.
          if aws s3api head-object --endpoint-url "$endpoint" --bucket "$bucket" \
               --key "${release}/onramp-embed.umd.js" >/dev/null 2>&1; then
            echo "::error::${release}/ already exists and published paths are immutable. Cut a new version."
            exit 1
          fi

          # The map goes first: if the second upload fails, an unreferenced map is inert, whereas
          # a bundle whose sourceMappingURL 404s is a broken devtools experience for every partner.
          upload() {
            aws s3api put-object \
              --endpoint-url "$endpoint" --bucket "$bucket" \
              --key "$1" --body "$2" \
              --content-type "$3" --cache-control "$4" >/dev/null
            echo "  uploaded $1"
          }

          immutable="public, max-age=31536000, immutable"
          revalidate="public, max-age=300, must-revalidate"

          echo "Publishing ${version} to ${bucket}:"
          upload "${release}/onramp-embed.umd.js.map" "${dist}/onramp-embed.umd.js.map" \
            "application/json; charset=utf-8" "$immutable"
          upload "${release}/onramp-embed.umd.js" "${dist}/onramp-embed.umd.js" \
            "text/javascript; charset=utf-8" "$immutable"

          # The alias is overwritten every release, which is why the bucket lock prefix stops at
          # embed/releases/. The map ships here too: sourceMappingURL is relative, so it resolves
          # against whichever directory the script was loaded from.
          upload "${alias}/onramp-embed.umd.js.map" "${dist}/onramp-embed.umd.js.map" \
            "application/json; charset=utf-8" "$revalidate"
          upload "${alias}/onramp-embed.umd.js" "${dist}/onramp-embed.umd.js" \
            "text/javascript; charset=utf-8" "$revalidate"

          {
            echo "CDN_VERSION=${version}"
            echo "CDN_ALIAS=v${major}"
          } >> "$GITHUB_ENV"

      - name: Record the CDN integrity hash
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          hash="sha384-$(openssl dgst -sha384 -binary packages/embed/dist/onramp-embed.umd.js | openssl base64 -A)"
          {
            echo "### Subresource integrity"
            echo ""
            echo '```html'
            echo "<script src=\"https://js.onrampfunds.com/embed/releases/${CDN_VERSION}/onramp-embed.umd.js\""
            echo "        integrity=\"$hash\""
            echo '        crossorigin="anonymous"></script>'
            echo '```'
            echo ""
            echo "Unpinned alias (no integrity, moves with every ${CDN_ALIAS}.x release):"
            echo ""
            echo '```'
            echo "https://js.onrampfunds.com/embed/${CDN_ALIAS}/onramp-embed.umd.js"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
