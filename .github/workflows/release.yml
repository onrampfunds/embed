name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  # Trusted publishing: the workflow proves its own identity to npm over OIDC, so there is no
  # long-lived automation token in repository secrets to leak or rotate.
  id-token: write

jobs:
  publish:
    name: Publish both packages
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 still ships npm 10.
      # Pinned rather than `@latest` so a release is reproducible and a new npm
      # major cannot break publishing on a day nobody touched this repo. Bump it
      # deliberately.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@11.5.1
          npm --version

      - run: npm ci

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/embed/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      # Nothing publishes unless the full verification passes: the guards run here as well as in
      # CI, because this is the last point at which a bad artefact can be stopped.
      - run: npm run verify

      # A tag push always publishes; only workflow_dispatch consults `dry-run`.
      #
      # Written against `github.event_name` rather than relying on `inputs` being empty on a push
      # event. It very likely is, but "is this expression truthy on a tag push" is not a question
      # anyone should have to answer from memory while reading the step that publishes to a public
      # registry — and being wrong fails in both directions, either a release that silently does
      # nothing or one that publishes when it should not.
      - name: Publish @onrampfunds/embed
        if: ${{ github.event_name == 'push' || inputs.dry-run != true }}
        run: npm publish --workspace @onrampfunds/embed

      # Published second, because it depends on the exact core version above.
      - name: Publish @onrampfunds/embed-react
        if: ${{ github.event_name == 'push' || inputs.dry-run != true }}
        run: npm publish --workspace @onrampfunds/embed-react

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run == true }}
        run: |
          npm publish --workspace @onrampfunds/embed --dry-run
          npm publish --workspace @onrampfunds/embed-react --dry-run

      # Runs after npm, deliberately. If npm fails we want nothing on the CDN; the reverse order
      # would leave an immutable, undeletable bundle for a version that was never published.
      - name: Upload the CDN bundle to R2
        if: ${{ github.event_name == 'push' || inputs.dry-run != true }}
        env:
          # R2 speaks S3, so the AWS CLI on the runner is enough — no extra dependency.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./packages/embed/package.json').version")"
          major="${version%%.*}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          bucket="onramp-embed"
          dist="packages/embed/dist"
          release="embed/releases/${version}"
          alias="embed/v${major}"

          # Both files or neither. A version path is covered by the bucket lock, so a partial
          # upload cannot be repaired — it can only be abandoned and a new version cut.
          for file in onramp-embed.umd.js onramp-embed.umd.js.map; do
            if [ ! -s "${dist}/${file}" ]; then
              echo "::error::${dist}/${file} is missing or empty; refusing to upload a partial release"
              exit 1
            fi
          done

          # Fail before writing anything rather than letting the bucket lock reject it mid-upload.
          if aws s3api head-object --endpoint-url "$endpoint" --bucket "$bucket" \
               --key "${release}/onramp-embed.umd.js" >/dev/null 2>&1; then
            echo "::error::${release}/ already exists and published paths are immutable. Cut a new version."
            exit 1
          fi

          # The map goes first: if the second upload fails, an unreferenced map is inert, whereas
          # a bundle whose sourceMappingURL 404s is a broken devtools experience for every partner.
          #
          # Cache-Control is set on the object as well as in the Cloudflare cache rules. The rules
          # govern the edge; this governs the browser, and it keeps the intent readable here.
          upload() {
            aws s3api put-object \
              --endpoint-url "$endpoint" --bucket "$bucket" \
              --key "$1" --body "$2" \
              --content-type "$3" --cache-control "$4" >/dev/null
            echo "  uploaded $1"
          }

          immutable="public, max-age=31536000, immutable"
          revalidate="public, max-age=300, must-revalidate"

          echo "Publishing ${version} to ${bucket}:"
          upload "${release}/onramp-embed.umd.js.map" "${dist}/onramp-embed.umd.js.map" \
            "application/json; charset=utf-8" "$immutable"
          upload "${release}/onramp-embed.umd.js" "${dist}/onramp-embed.umd.js" \
            "text/javascript; charset=utf-8" "$immutable"

          # The alias is overwritten every release, which is why the bucket lock prefix stops at
          # embed/releases/. The map ships here too: sourceMappingURL is relative, so it resolves
          # against whichever directory the script was loaded from.
          upload "${alias}/onramp-embed.umd.js.map" "${dist}/onramp-embed.umd.js.map" \
            "application/json; charset=utf-8" "$revalidate"
          upload "${alias}/onramp-embed.umd.js" "${dist}/onramp-embed.umd.js" \
            "text/javascript; charset=utf-8" "$revalidate"

          {
            echo "CDN_VERSION=${version}"
            echo "CDN_ALIAS=v${major}"
          } >> "$GITHUB_ENV"

      - name: Record the CDN integrity hash
        if: ${{ github.event_name == 'push' || inputs.dry-run != true }}
        run: |
          set -euo pipefail
          hash="sha384-$(openssl dgst -sha384 -binary packages/embed/dist/onramp-embed.umd.js | openssl base64 -A)"
          {
            echo "### Subresource integrity"
            echo ""
            echo '```html'
            echo "<script src=\"https://js.onrampfunds.com/embed/releases/${CDN_VERSION}/onramp-embed.umd.js\""
            echo "        integrity=\"$hash\""
            echo '        crossorigin="anonymous"></script>'
            echo '```'
            echo ""
            echo "Unpinned alias (no integrity, moves with every ${CDN_ALIAS}.x release):"
            echo ""
            echo '```'
            echo "https://js.onrampfunds.com/embed/${CDN_ALIAS}/onramp-embed.umd.js"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
